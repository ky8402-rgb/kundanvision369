name: Automated CI/CD & Deploy to GitHub Pages & Render

on:
  push:
    branches:
      - main
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment
concurrency:
  group: "pages-and-render-deploy"
  cancel-in-progress: true

jobs:
  # ==========================================
  # 1. Build & Test Job
  # ==========================================
  build-and-test:
    name: 🧪 Automated Tests & Build Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci || npm install

      - name: Verify Environment Configuration
        run: npm run check:env
        continue-on-error: true

      - name: Run TypeScript & Type Verification
        run: npm test

      # Automatically derives repository name for GitHub Pages path prefix (e.g. /<repo-name>/)
      - name: Determine VITE_BASE_URL for GitHub Pages
        id: base_url
        run: |
          REPO_NAME="${{ github.event.repository.name }}"
          # If custom repository or user/org site (<user>.github.io), handle base URL
          if [[ "${{ github.repository }}" == *.github.io ]]; then
            echo "vite_base=/" >> $GITHUB_OUTPUT
            echo "Determined GitHub Pages Root Base URL: /"
          elif [ -n "$REPO_NAME" ]; then
            echo "vite_base=/${REPO_NAME}/" >> $GITHUB_OUTPUT
            echo "Determined GitHub Pages Repository Base URL: /${REPO_NAME}/"
          else
            echo "vite_base=./" >> $GITHUB_OUTPUT
            echo "Falling back to relative Base URL: ./"
          fi

      - name: Build Static Frontend for GitHub Pages
        run: npm run build:client
        env:
          NODE_ENV: production
          VITE_BASE_URL: ${{ steps.base_url.outputs.vite_base }}

      # Ensures Single-Page Apps (SPA) reload properly on GitHub Pages subroutes
      - name: Copy index.html to 404.html for SPA Routing
        run: cp dist/index.html dist/404.html

      - name: Upload GitHub Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

  # ==========================================
  # 2. Deploy Frontend to GitHub Pages
  # ==========================================
  deploy-github-pages:
    name: 🚀 Deploy Frontend to GitHub Pages
    needs: build-and-test
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  # ==========================================
  # 3. Trigger Render Backend Deployment
  # ==========================================
  trigger-render-deploy:
    name: 🔄 Trigger Render Auto-Deploy & Webhook
    needs: build-and-test
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Render Service Deploy
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          echo "Initiating automated deployment trigger to Render..."

          # Option 1: Trigger via Render REST API (if RENDER_API_KEY and RENDER_SERVICE_ID are provided)
          if [ -n "$RENDER_API_KEY" ] && [ -n "$RENDER_SERVICE_ID" ]; then
            echo "Triggering deployment using Render REST API for service: $RENDER_SERVICE_ID"
            RESPONSE=$(curl -s -w "\nHTTP_STATUS:%{http_code}" -X POST \
              "https://api.render.com/v1/services/$RENDER_SERVICE_ID/deploys" \
              -H "Accept: application/json" \
              -H "Content-Type: application/json" \
              -H "Authorization: Bearer $RENDER_API_KEY" \
              -d '{"clearCache": "do_not_clear"}')
            
            HTTP_STATUS=$(echo "$RESPONSE" | grep "HTTP_STATUS:" | cut -d':' -f2)
            BODY=$(echo "$RESPONSE" | sed '/HTTP_STATUS:/d')

            echo "Response: $BODY"
            if [ "$HTTP_STATUS" -ge 200 ] && [ "$HTTP_STATUS" -lt 300 ]; then
              echo "✅ Render deployment successfully initiated via REST API (HTTP $HTTP_STATUS)!"
              exit 0
            else
              echo "❌ Render API returned HTTP $HTTP_STATUS: $BODY"
              exit 1
            fi

          # Option 2: Trigger via Render Deploy Hook URL (if RENDER_DEPLOY_HOOK_URL is provided)
          elif [ -n "$RENDER_DEPLOY_HOOK_URL" ]; then
            echo "Triggering deployment using Render Deploy Hook URL..."
            HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" -X POST "$RENDER_DEPLOY_HOOK_URL")
            
            if [ "$HTTP_STATUS" -ge 200 ] && [ "$HTTP_STATUS" -lt 300 ]; then
              echo "✅ Render deployment successfully triggered via Deploy Hook (HTTP $HTTP_STATUS)!"
              exit 0
            else
              echo "❌ Deploy Hook returned HTTP $HTTP_STATUS"
              exit 1
            fi

          # Fallback notice when secrets are not yet added to GitHub Repo Settings
          else
            echo "ℹ️ Info: Render Auto-Deploy on Git Push is active natively if connected to GitHub."
            echo "To enable explicit Deploy Hook triggers from GitHub Actions, add RENDER_DEPLOY_HOOK_URL to GitHub Repo Secrets."
            exit 0
          fi
