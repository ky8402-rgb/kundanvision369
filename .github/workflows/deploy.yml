name: CI/CD Pipeline - Test and Deploy to Render

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ------------------------------------------------------------
  # 1. Test and Build Job (npm install, npm test, npm run build)
  # ------------------------------------------------------------
  test-and-build:
    name: Install, Test & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm install

      - name: Generate Prisma Client (if schema exists)
        run: |
          if [ -f "prisma/schema.prisma" ]; then
            npx prisma generate
          fi

      - name: Run Tests
        run: npm test

      - name: Run Production Build
        run: npm run build

  # ------------------------------------------------------------
  # 2. Deployment to Render via API / Deploy Hooks
  # ------------------------------------------------------------
  deploy-to-render:
    name: Deploy to Render
    needs: test-and-build
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest

    steps:
      - name: Trigger Render Deploy Hook / API
        env:
          RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK || secrets.RENDER_BACKEND_DEPLOY_HOOK }}
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
        run: |
          echo "🚀 Initiating deployment to Render..."
          
          # Strategy 1: Deploy Hook (Recommended & Simplest)
          if [ -n "$RENDER_DEPLOY_HOOK" ]; then
            echo "📡 Calling Render Deploy Webhook..."
            HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" -X POST "$RENDER_DEPLOY_HOOK")
            if [ "$HTTP_CODE" -ge 200 ] && [ "$HTTP_CODE" -lt 300 ]; then
              echo "✅ Render Deploy Hook triggered successfully (HTTP $HTTP_CODE)!"
            else
              echo "❌ Render Deploy Hook failed with HTTP $HTTP_CODE"
              exit 1
            fi
          
          # Strategy 2: Render REST API (with API Key & Service ID)
          elif [ -n "$RENDER_API_KEY" ] && [ -n "$RENDER_SERVICE_ID" ]; then
            echo "📡 Calling Render REST API (v1/services/$RENDER_SERVICE_ID/deploys)..."
            HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" -X POST \
              -H "Authorization: Bearer $RENDER_API_KEY" \
              -H "Accept: application/json" \
              -H "Content-Type: application/json" \
              "https://api.render.com/v1/services/$RENDER_SERVICE_ID/deploys")
            if [ "$HTTP_CODE" -ge 200 ] && [ "$HTTP_CODE" -lt 300 ]; then
              echo "✅ Render REST API deployment dispatched successfully (HTTP $HTTP_CODE)!"
            else
              echo "❌ Render REST API call failed with HTTP $HTTP_CODE"
              exit 1
            fi

          # Strategy 3: Render Auto-Deploy fallback
          else
            echo "ℹ️ Note: No RENDER_DEPLOY_HOOK or RENDER_API_KEY secret found."
            echo "If your Render service has 'Auto-Deploy: Yes' connected to GitHub, Render is already deploying your commit automatically."
          fi
