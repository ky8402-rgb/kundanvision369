name: Deploy to Render

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: "render-deploy"
  cancel-in-progress: true

jobs:
  build-and-deploy:
    name: Build Verification & Render Deployment Trigger
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm install

      - name: Build Application
        run: npm run build

      - name: Trigger Render Deployment via Render API / Deploy Hook
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          echo "Initiating automated deployment trigger to Render..."

          # Option 1: Trigger via Render REST API (if RENDER_API_KEY and RENDER_SERVICE_ID are provided)
          if [ -n "$RENDER_API_KEY" ] && [ -n "$RENDER_SERVICE_ID" ]; then
            echo "Triggering deployment using Render REST API for service: $RENDER_SERVICE_ID"
            RESPONSE=$(curl -s -w "\nHTTP_STATUS:%{http_code}" -X POST \
              "https://api.render.com/v1/services/$RENDER_SERVICE_ID/deploys" \
              -H "Accept: application/json" \
              -H "Content-Type: application/json" \
              -H "Authorization: Bearer $RENDER_API_KEY" \
              -d '{"clearCache": "do_not_clear"}')
            
            HTTP_STATUS=$(echo "$RESPONSE" | grep "HTTP_STATUS:" | cut -d':' -f2)
            BODY=$(echo "$RESPONSE" | sed '/HTTP_STATUS:/d')

            echo "Response: $BODY"
            if [ "$HTTP_STATUS" -ge 200 ] && [ "$HTTP_STATUS" -lt 300 ]; then
              echo "✅ Render deployment successfully initiated via REST API (HTTP $HTTP_STATUS)!"
              exit 0
            else
              echo "❌ Render API returned HTTP $HTTP_STATUS: $BODY"
              exit 1
            fi

          # Option 2: Trigger via Render Deploy Hook URL (if RENDER_DEPLOY_HOOK_URL is provided)
          elif [ -n "$RENDER_DEPLOY_HOOK_URL" ]; then
            echo "Triggering deployment using Render Deploy Hook URL..."
            HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" -X POST "$RENDER_DEPLOY_HOOK_URL")
            
            if [ "$HTTP_STATUS" -ge 200 ] && [ "$HTTP_STATUS" -lt 300 ]; then
              echo "✅ Render deployment successfully triggered via Deploy Hook (HTTP $HTTP_STATUS)!"
              exit 0
            else
              echo "❌ Deploy Hook returned HTTP $HTTP_STATUS"
              exit 1
            fi

          # Fallback notice when secrets are not yet added to GitHub Repo Settings
          else
            echo "⚠️ Notice: No Render API credentials found in GitHub Secrets."
            echo "To enable automated API deployments, add either:"
            echo "  1. RENDER_API_KEY and RENDER_SERVICE_ID in GitHub Repo -> Settings -> Secrets and variables -> Actions"
            echo "  2. OR RENDER_DEPLOY_HOOK_URL in GitHub Repo Secrets (from Render Service Dashboard -> Settings -> Deploy Hook)"
            echo ""
            echo "Note: If your Render Web Service is directly connected to this GitHub repo, Render auto-deploys on push to main natively."
            exit 0
          fi

