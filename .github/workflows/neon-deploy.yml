name: Push Database Schema to Neon

on:
  push:
    branches:
      - main
    paths:
      - 'prisma/schema.prisma'
      - '.github/workflows/neon-deploy.yml'
  workflow_dispatch:

jobs:
  migrate-to-neon:
    name: Sync Schema & Migrate to Neon PostgreSQL
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Push Prisma Schema to Neon Database
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          echo "Syncing schema to Neon Database..."
          npx prisma db push --skip-generate
          npx prisma generate
