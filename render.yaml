services:
  # 1. Main FastAPI Auto-Bid & Telemetry Web Service
  - type: web
    name: freelancer-autobid-engine
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port 10000
    envVars:
      - key: FREELANCER_ACCESS_TOKEN
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
      - key: DASHBOARD_USERNAME
        value: admin
      - key: DASHBOARD_PASSWORD
        sync: false
      - key: BASE_URL
        value: https://kundanvision369.onrender.com
      - key: SQLITE_DB_PATH
        value: bids.db

  # 2. Hourly Project Discovery & Auto-Bidding Cron Job
  - type: cron
    name: cron-find-and-bid
    runtime: python
    schedule: "0 * * * *"
    buildCommand: pip install -r requirements.txt
    startCommand: curl -X GET https://freelancer-autobid-engine.onrender.com/api/cron/find-and-bid

  # 3. 30-Minute Real-Time Bid Sync & Won Alerts Cron Job
  - type: cron
    name: cron-sync-bids
    runtime: python
    schedule: "*/30 * * * *"
    buildCommand: pip install -r requirements.txt
    startCommand: curl -X GET https://freelancer-autobid-engine.onrender.com/api/cron/sync-bids

