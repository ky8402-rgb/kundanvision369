services:
  # 1. Primary Full-Stack Node.js Web Application (React + Express + API Proxy)
  - type: web
    name: gigpilot-web
    runtime: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: GEMINI_API_KEY
        sync: false
      - key: FREELANCER_ACCESS_TOKEN
        sync: false
      - key: PAYPAL_RECEIVER_EMAIL
        value: kundank4@icloud.com
      - key: PAYPAL_ME_USERNAME
        value: ky8402
      - key: PAYPAL_MODE
        value: live

  # 2. FastAPI Auto-Bid Engine & Background Python Services
  - type: web
    name: freelancer-autobid-engine
    runtime: python
    plan: free
    buildCommand: pip install --no-cache-dir -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port ${PORT:-10000}
    envVars:
      - key: FREELANCER_ACCESS_TOKEN
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
      - key: DASHBOARD_USERNAME
        value: admin
      - key: DASHBOARD_PASSWORD
        sync: false
      - key: SQLITE_DB_PATH
        value: bids.db

  # 3. Hourly Project Discovery & Auto-Bidding Cron Job
  - type: cron
    name: cron-find-and-bid
    runtime: python
    schedule: "0 * * * *"
    buildCommand: pip install --no-cache-dir -r requirements.txt
    startCommand: curl -f -s https://freelancer-autobid-engine.onrender.com/api/cron/find-and-bid || true

  # 4. 30-Minute Real-Time Bid Sync & Won Alerts Cron Job
  - type: cron
    name: cron-sync-bids
    runtime: python
    schedule: "*/30 * * * *"
    buildCommand: pip install --no-cache-dir -r requirements.txt
    startCommand: curl -f -s https://freelancer-autobid-engine.onrender.com/api/cron/sync-bids || true

